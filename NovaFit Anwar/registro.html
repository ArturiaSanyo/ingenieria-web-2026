<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaFit | Registro</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><h1>NovaFit</h1><p>Registra tu información</p></header>
<nav><a href="/">Inicio</a><a href="/acerca">Acerca de</a><a href="/registro">Registro</a><a href="/servicios">Servicios</a></nav>
<main>
<section class="form-section">
  <h2>Registro de usuario</h2>
  <p>Completa el formulario para obtener tu identificador de usuario.</p>
  <form action="/usuarios" method="POST">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" type="text" required>
    <label for="correo">Correo electrónico</label>
    <input id="correo" name="correo" type="email" required>
    <label for="telefono">Teléfono</label>
    <input id="telefono" name="telefono" type="tel" required>
    <button type="submit">Registrar usuario</button>
  </form>
</section>
</main>
<footer><p>Después del registro, conserva el ID generado.</p></footer>
</body>
</html>
